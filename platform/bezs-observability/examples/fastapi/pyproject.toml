[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "watcher24-example-fastapi"
version = "0.0.1"
description = "Watcher24 FastAPI integration example"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.29.0",
    "python-dotenv>=1.0.0",
    "watcher-sdk @ file:///../../../sdk/python",
]

[dependency-groups]
dev = [
    "httpx>=0.27.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]
