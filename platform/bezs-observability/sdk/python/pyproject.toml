[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "watcher-sdk"
version = "0.1.0"
description = "Watcher24 Python SDK — send telemetry events to the Watcher24 gateway"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
fastapi = ["fastapi>=0.100.0"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "fastapi>=0.100.0",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]

[tool.coverage.run]
source = ["src"]
omit = ["tests/*"]
