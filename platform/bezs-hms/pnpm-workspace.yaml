allowBuilds:
  '@parcel/watcher': true
  '@prisma/engines': true
  '@swc/core': true
  core-js: true
  # dicom.ts ships a stray `postinstall: patch-package` meant for its own repo's
  # dev workflow, not for consumers — the dist/ we actually use is prebuilt and
  # already in the published package. Running it just fails (patch-package
  # isn't installed here), so it's explicitly disallowed rather than approved.
  dicom.ts: false
  esbuild: true
  msw: true
  prisma: true
  sharp: true
  unrs-resolver: true
minimumReleaseAgeExclude:
  - '@filenest-fs/core@0.1.0'
  - '@filenest-fs/node@0.1.1'
  - '@filenest-fs/react@0.1.0'
  - '@filenest-fs/nextjs@0.1.0'
onlyBuiltDependencies:
  - "@parcel/watcher"
  - "@prisma/engines"
  - "@swc/core"
  - core-js
  - esbuild
  - msw
  - prisma
  - sharp
  - unrs-resolver
patchedDependencies:
  dicom.ts: patches/dicom.ts.patch
