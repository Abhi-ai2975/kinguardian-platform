[project]
name = "kinguardian-backend"
version = "0.1.0"
description = "KinGuardian platform backend service"
readme = "README.md"

requires-python = ">=3.12"

dependencies = [
    "alembic>=1.14.0",
    "asyncpg>=0.31.0",
    "fastapi[standard]>=0.129.0",
    "pydantic-settings>=2.13.0",
    "pyjwt>=2.11.0",
    "cryptography>=42.0.0",
    "redis>=7.2.0",
    "sqlalchemy>=2.0.46",
    "uvicorn[standard]>=0.30.0",
    "httpx>=0.28.1",
    "filenest",
    "tzdata",
    "nats-py>=2.15.0",
]

[tool.uv.sources]
filenest = { path = "../bezs-filenest/sdks/python", editable = true }

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=5.0.0",
    "aiosqlite>=0.22.1",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "bandit>=1.7.10",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "unit: Pure unit tests for domain entities, algorithms, and utilities.",
    "application_service: Application service, permission, and business logic tests.",
    "repository_integration: Repository, schema, constraint, and database integration tests.",
    "api_integration: Presentation layer, router, authentication, and HTTP integration tests.",
    "e2e_workflow: Complete end-to-end multi-actor cross-border workflow tests.",
]

[tool.ruff]
target-version = "py312"
line-length = 120
exclude = [
    ".venv",
    "migrations",
]

[tool.ruff.lint]
select = [
    "E9",  # syntax errors
    "F63", # if/elif test identity
    "F7",  # undefined names / internal errors
    "F82", # undefined symbols
    "E",   # errors
    "F",   # pyflakes
    "W",   # warnings
]
ignore = [
    "E501",  # line length handled by black/formatter
    "W291",  # trailing whitespace
    "W293",  # blank line contains whitespace
    "W292",  # no newline at end of file
    "E741",  # ambiguous variable name
    "F401",  # unused imports (common in test suites and __init__.py re-exports)
    "F403",  # star imports in __init__.py re-exports
    "F405",  # star import names
    "F841",  # assigned but unused local variable (common in test assertions and fixture setups)
    "E402",  # module level import not at top of file
    "E712",  # comparison to True/False with == (SQLAlchemy boolean expressions)
    "E711",  # comparison to None with == (SQLAlchemy column comparisons)
    "E722",  # bare except (legacy fallbacks)
    "F811",  # redefinition of unused name (pytest fixtures)
    "B008",  # do not perform function calls in argument defaults (FastAPI Depends)
    "S101",  # use of assert (standard in pytest)
]




[tool.mypy]
python_version = "3.12"
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
follow_imports = "silent"
disable_error_code = [
    "union-attr",
    "arg-type",
    "assignment",
    "call-arg",
    "attr-defined",
    "method-assign",
    "var-annotated",
    "return-value",
    "misc",
    "type-arg"
]
exclude = [
    "^migrations/",
    "^tests/",
]

[tool.bandit]
exclude_dirs = ["tests", "migrations", ".venv"]
skips = ["B101", "B104", "B105", "B106", "B107", "B311"]



