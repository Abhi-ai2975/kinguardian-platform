[project]
name = "bezs-agent"
version = "0.1.0"
description = "Multi-agent clinical voice system with streaming STT, diarization, and MLflow tracking"
requires-python = ">=3.12"
dependencies = [
    "python-dotenv",
    "mlflow>=2.0.0",
    "psutil>=5.8.0",
    "pydantic",
    "tomli",
    "platformdirs",
    "openai",
    "ddgs",
    "tiktoken",
    "fastapi",
    "reportlab",
    "requests",
    "websockets",
    "setuptools",
    "httpx",
    "fastmcp",
    "rich",
    "click",
    "PyJWT>=2.0.0",
    "soundfile",
    "sarvamai",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["*"]
