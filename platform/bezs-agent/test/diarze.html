<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hybrid Diarization Test</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0b1120;
            color: #e2e8f0;
            font-family: 'Segoe UI', system-ui, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 2rem;
        }

        .container {
            width: 800px;
            max-width: 100%;
        }

        .card {
            background: #111827;
            border: 1px solid #1e293b;
            padding: 28px;
            border-radius: 16px;
        }

        h1 {
            text-align: center;
            font-size: 1.4rem;
            margin-bottom: 6px;
        }

        .subtitle {
            text-align: center;
            color: #64748b;
            font-size: 0.85rem;
            margin-bottom: 20px;
        }

        .status-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
            padding: 10px 14px;
            background: #0f172a;
            border-radius: 10px;
        }

        .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #64748b;
            flex-shrink: 0;
        }

        .dot.connected {
            background: #22c55e;
        }

        .dot.recording {
            background: #ef4444;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0% {
                opacity: 1;
            }

            50% {
                opacity: 0.3;
            }

            100% {
                opacity: 1;
            }
        }

        .status-label {
            font-weight: 600;
            font-size: 0.9rem;
        }

        .status-msg {
            color: #94a3b8;
            font-size: 0.8rem;
            margin-left: auto;
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 14px;
            margin-bottom: 24px;
        }

        button {
            border: none;
            padding: 12px 30px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 15px;
            font-weight: 600;
            transition: opacity 0.15s;
        }

        button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .btn-start {
            background: #16a34a;
            color: #fff;
        }

        .btn-start:hover:not(:disabled) {
            background: #15803d;
        }

        .btn-stop {
            background: #dc2626;
            color: #fff;
        }

        .btn-stop:hover:not(:disabled) {
            background: #b91c1c;
        }

        .panel {
            background: #0f172a;
            border: 1px solid #1e293b;
            border-radius: 12px;
            padding: 18px;
            margin-bottom: 16px;
        }

        .panel h3 {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: #64748b;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .panel h3 .badge {
            font-size: 0.65rem;
            background: #1e293b;
            color: #94a3b8;
            padding: 2px 8px;
            border-radius: 20px;
            font-weight: 400;
        }

        .content {
            min-height: 50px;
            max-height: 200px;
            overflow-y: auto;
            font-size: 0.95rem;
            line-height: 1.7;
            white-space: pre-wrap;
            color: #cbd5e1;
        }

        .content.draft {
            color: #64748b;
            font-style: italic;
        }

        .final-transcript {
            background: linear-gradient(135deg, #1e293b 0%, #172033 100%);
            border: 1px solid #334155;
            border-radius: 14px;
            padding: 20px;
            margin-top: 8px;
        }

        .final-transcript h3 {
            color: #22c55e;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            margin-bottom: 14px;
        }

        .final-transcript .content {
            max-height: 500px;
            line-height: 1.8;
        }

        .doctor-line {
            color: #60a5fa;
        }

        .patient-line {
            color: #c084fc;
        }

        .unknown-line {
            color: #94a3b8;
        }

        .lang-tag {
            display: inline-block;
            background: #334155;
            color: #94a3b8;
            padding: 2px 10px;
            border-radius: 12px;
            font-size: 0.75rem;
            margin-bottom: 8px;
        }

        .hidden {
            display: none;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="card">
            <h1>Hybrid Streaming + Batch Diarization</h1>
            <p class="subtitle">Live transcription preview → silence timeout → batch diarization with speaker labels</p>

            <div class="status-row">
                <div class="dot" id="dot"></div>
                <span class="status-label" id="statusLabel">Disconnected</span>
                <span class="status-msg" id="statusMsg"></span>
            </div>

            <div class="controls">
                <button class="btn-start" id="btnStart" onclick="startSession()">Start Recording</button>
                <button class="btn-stop" id="btnStop" onclick="stopSession()" disabled>Stop & Diarize</button>
            </div>

            <div class="panel">
                <h3>Live Draft <span class="badge" id="langTag" style="display:none"></span></h3>
                <div class="content draft" id="draftContent">Waiting for speech...</div>
            </div>

            <div class="panel">
                <h3>Partial Transcripts</h3>
                <div class="content" id="partialContent"></div>
            </div>

            <div class="final-transcript hidden" id="finalPanel">
                <h3>Final Diarized Transcript</h3>
                <div class="content" id="finalContent"></div>
            </div>
        </div>
    </div>

        let ws = null;
        let audioCtx = null;
        let micStream = null;
        let scriptNode = null;
        let source = null;

        const dot = document.getElementById('dot');
        const statusLabel = document.getElementById('statusLabel');
        const statusMsg = document.getElementById('statusMsg');
        const btnStart = document.getElementById('btnStart');
        const btnStop = document.getElementById('btnStop');
        const draftContent = document.getElementById('draftContent');
        const partialContent = document.getElementById('partialContent');
        const langTag = document.getElementById('langTag');
        const finalPanel = document.getElementById('finalPanel');
        const finalContent = document.getElementById('finalContent');

        function setStatus(label, msg, cls) {
            statusLabel.textContent = label;
            statusMsg.textContent = msg || '';
            dot.className = 'dot ' + (cls || '');
        }

        async function startSession() {
            if (ws) return;

            draftContent.textContent = 'Waiting for speech...';
            partialContent.textContent = '';
            finalPanel.classList.add('hidden');
            finalContent.textContent = '';
            langTag.style.display = 'none';

            try {
                micStream = await navigator.mediaDevices.getUserMedia({
                    audio: { sampleRate: 16000, channelCount: 1, echoCancellation: true }
                });
            } catch (e) {
                setStatus('Error', 'Microphone access denied', '');
                alert('Microphone access required: ' + e.message);
                return;
            }

            audioCtx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 16000 });

            ws = new WebSocket(`${WS_URL}?token=${encodeURIComponent(TOKEN)}`);

            ws.binaryType = 'arraybuffer';

            ws.onopen = () => {
                setStatus('Connected', 'Streaming audio...', 'connected recording');

                source = audioCtx.createMediaStreamSource(micStream);
                scriptNode = audioCtx.createScriptProcessor(4096, 1, 1);

                source.connect(scriptNode);
                scriptNode.connect(audioCtx.destination);

                scriptNode.onaudioprocess = (event) => {
                    if (!ws || ws.readyState !== WebSocket.OPEN) return;
                    const input = event.inputBuffer.getChannelData(0);
                    const pcm = new Int16Array(input.length);
                    for (let i = 0; i < input.length; i++) {
                        let s = Math.max(-1, Math.min(1, input[i]));
                        pcm[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
                    }
                    ws.send(pcm.buffer);
                };

                btnStart.disabled = true;
                btnStop.disabled = false;
            };

            ws.onmessage = (event) => {
                try {
                    const data = JSON.parse(event.data);

                    if (data.type === 'partial') {
                        partialContent.textContent += data.text + '\n';
                        partialContent.scrollTop = partialContent.scrollHeight;
                    }

                    if (data.type === 'language') {
                        langTag.style.display = 'inline-block';
                        langTag.textContent = data.code;
                    }

                    if (data.type === 'final') {
                        setStatus('Complete', 'Diarization finished', 'connected');
                        finalPanel.classList.remove('hidden');
                        finalContent.textContent = '';
                        renderFinalTranscript(data.transcript);
                        cleanup();
                    }

                    if (data.type === 'error') {
                        setStatus('Error', data.message, '');
                    }
                } catch (e) {
                    // Non-JSON messages: may be streaming draft text or binary
                    if (event.data instanceof ArrayBuffer || event.data instanceof Blob) {
                        return;
                    }
                    draftContent.textContent = event.data;
                }
            };

            ws.onerror = () => {
                setStatus('Error', 'WebSocket error', '');
                cleanup();
            };

            ws.onclose = () => {
                if (statusLabel.textContent !== 'Complete') {
                    setStatus('Disconnected', 'Connection closed', '');
                }
                cleanup();
            };
        }

        function renderFinalTranscript(transcript) {
            if (!transcript) return;
            const lines = transcript.split('\n');
            for (const line of lines) {
                const div = document.createElement('div');
                if (line.startsWith('Doctor:')) {
                    div.className = 'doctor-line';
                } else if (line.startsWith('Patient:')) {
                    div.className = 'patient-line';
                } else {
                    div.className = 'unknown-line';
                }
                div.textContent = line;
                finalContent.appendChild(div);
            }
            finalContent.scrollTop = finalContent.scrollHeight;
        }

        function stopSession() {
            // Stop the microphone stream — this creates silence which triggers
            // the server-side VAD timeout → diarization finalization → 'final' event
            if (scriptNode) {
                scriptNode.disconnect();
                scriptNode = null;
            }
            if (source) {
                source.disconnect();
                source = null;
            }
            if (micStream) {
                micStream.getTracks().forEach(t => t.stop());
                micStream = null;
            }
            if (audioCtx && audioCtx.state !== 'closed') {
                audioCtx.close();
                audioCtx = null;
            }

            // The WS stays open — server will detect silence, diarize, and send the 'final' event
            setStatus('Finalizing', 'Silence detected — processing diarization...', 'connected');
            btnStop.disabled = true;
        }

        function cleanup() {
            if (scriptNode) {
                scriptNode.disconnect();
                scriptNode = null;
            }
            if (source) {
                source.disconnect();
                source = null;
            }
            if (micStream) {
                micStream.getTracks().forEach(t => t.stop());
                micStream = null;
            }
            if (audioCtx && audioCtx.state !== 'closed') {
                audioCtx.close();
                audioCtx = null;
            }
            if (ws) {
                ws.onmessage = null;
                ws.onerror = null;
                ws.onclose = null;
                if (ws.readyState === WebSocket.OPEN) {
                    ws.close();
                }
                ws = null;
            }
            btnStart.disabled = false;
            btnStop.disabled = true;
            dot.className = 'dot';
        }
    </script>
</body>

</html>
