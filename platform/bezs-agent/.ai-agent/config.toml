hooks_enabled = true

[model]
temperature = 0

[[hooks]]
name='test_before_tool'
trigger='before_tool'
command='python3 ./scripts/test_tool.py'

[[hooks]]
name='test_before_agent'
trigger='before_agent'
command='python3 ./scripts/test_tool.py'


[mcp_servers.filesystem]
command = "npx"
args = ["-y", "@modelcontextprotocol/server-filesystem", "/home/kipla/mcpagent/mcpagent", "/tmp"]
transport = "stdio"

[mcp_servers.fhir]
url = "http://localhost:8002/mcp"
enabled = true
transport = "streamable-http"


