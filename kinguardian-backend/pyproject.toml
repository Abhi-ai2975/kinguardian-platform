[project]
name = "kinguardian-backend"
version = "0.1.0"
description = "KinGuardian family-care platform API"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14",
  "aiosqlite>=0.20",
  "asyncpg>=0.30",
  "fastapi[standard]>=0.115",
  "httpx>=0.28",
  "pydantic-settings>=2.7",
  "pyjwt[crypto]>=2.10",
  "sqlalchemy>=2.0",
  "tzdata>=2025.1",
]

[dependency-groups]
dev = ["aiosqlite>=0.20", "pytest>=8.3", "pytest-asyncio>=0.24"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
