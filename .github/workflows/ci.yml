name: KinGuardian CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  UV_VERSION: "latest"

jobs:
  # ============================================================================
  # 1. Security & Secrets Scanner
  # ============================================================================
  security-and-secrets:
    name: Security & Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks Secrets Detection
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

      - name: Install uv Package Manager
        uses: astral-sh/setup-uv@v3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Dependencies
        working-directory: platform/kinguardian-backend
        run: uv sync --frozen

      - name: Run Bandit Static Security Analysis (SAST)
        working-directory: platform/kinguardian-backend
        run: uv run bandit -r app --severity-level medium --confidence-level medium

  # ============================================================================
  # 2. Linting & Code Style
  # ============================================================================
  lint:
    name: Lint & Code Style
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Install uv Package Manager
        uses: astral-sh/setup-uv@v3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Dependencies
        working-directory: platform/kinguardian-backend
        run: uv sync --frozen

      - name: Run Ruff Linter
        working-directory: platform/kinguardian-backend
        run: uv run ruff check app tests

  # ============================================================================
  # 3. Type Checking
  # ============================================================================
  type-check:
    name: Static Type Checking
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Install uv Package Manager
        uses: astral-sh/setup-uv@v3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Dependencies
        working-directory: platform/kinguardian-backend
        run: uv sync --frozen

      - name: Run Mypy Type Checker
        working-directory: platform/kinguardian-backend
        run: uv run mypy app

  # ============================================================================
  # 4. Database Migration Consistency
  # ============================================================================
  migration-check:
    name: Database Migration Consistency
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: kinguardian_test
          POSTGRES_PASSWORD: kinguardian_password
          POSTGRES_DB: kinguardian_db_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Install uv Package Manager
        uses: astral-sh/setup-uv@v3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Dependencies
        working-directory: platform/kinguardian-backend
        run: uv sync --frozen

      - name: Verify Migration Chain Integrity & Offline SQL Generation
        working-directory: platform/kinguardian-backend
        env:
          DATABASE_URL: postgresql://kinguardian_test:kinguardian_password@localhost:5432/kinguardian_db_test
        run: |
          uv run pytest tests/test_database_migrations.py -v
          uv run alembic upgrade head
          uv run alembic downgrade base
          uv run alembic upgrade head

  # ============================================================================
  # 5. Unit & Integration Testing
  # ============================================================================
  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    needs: [lint, type-check]
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Install uv Package Manager
        uses: astral-sh/setup-uv@v3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Dependencies
        working-directory: platform/kinguardian-backend
        run: uv sync --frozen

      - name: Run Full Test Suite with Coverage
        working-directory: platform/kinguardian-backend
        env:
          ENVIRONMENT: testing
        run: uv run python -m pytest tests/ -v -W ignore --cov=app --cov-report=term-missing

  # ============================================================================
  # 6. Docker Build & Verification
  # ============================================================================
  docker-build:
    name: Production Docker Build
    runs-on: ubuntu-latest
    needs: [test, migration-check, security-and-secrets]
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build KinGuardian Backend Container Image
        uses: docker/build-push-action@v5
        with:
          context: platform/kinguardian-backend
          file: platform/kinguardian-backend/Dockerfile
          push: false
          tags: kinguardian-backend:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
